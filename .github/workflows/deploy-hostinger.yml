name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          server-dir: /domains/daatmidia.com.br/public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/.tools/**
            **/.pypackages/**
            **/.venv/**
            **/assets daat/**
            **/scripts/**
            **/.env.deploy*
            **/daatmidia-site-hostinger.zip
            **/README.md
            **/.gitignore
            **/.env.deploy.example
